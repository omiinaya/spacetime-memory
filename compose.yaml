# ============================================================================
# Spacetime Memory — Docker Compose
# ============================================================================
# Start with:
#   docker compose up -d
#
# This starts SpacetimeDB standalone with the module pre-published.
#
# Environment variables (set in .env or shell):
#   SPACETIMEDB_VERSION  — SpacetimeDB version (default: 2.4.1)
#   SPACETIMEDB_PORT     — Host port (default: 3001)
# ============================================================================

services:
  spacetimedb:
    build:
      context: .
      dockerfile: Dockerfile
    image: spacetime-memory
    container_name: spacetime-memory
    ports:
      - "${SPACETIMEDB_PORT:-3001}:3001"
    env_file:
      - path: .env
        required: false
    environment:
      SPACETIMEDB_HOST: 0.0.0.0
      SPACETIMEDB_PORT: 3001
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/3001"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - stmem-data:/app/data

volumes:
  stmem-data:
