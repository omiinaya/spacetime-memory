[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacetime-memory"
version = "1.0.0"
description = "Multi-layer memory infrastructure for AI agents on SpacetimeDB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["classifiers", "scripts"]
authors = [
    {name = "Spacetime Memory Contributors"},
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
    "click>=8",
    "feedparser>=6",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-autorefs>=1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[project.urls]
Homepage = "https://github.com/omiinaya/spacetime-memory"
Documentation = "https://omiinaya.github.io/spacetime-memory/"
Repository = "https://github.com/omiinaya/spacetime-memory"

[tool.pytest.ini_options]
markers = [
    "unit: tests that mock HTTP — no SpacetimeDB required",
    "integration: tests that need a running SpacetimeDB standalone",
    "embedder: tests that also need the ONNX embedder sidecar on :9090",
]
testpaths = ["tests"]
