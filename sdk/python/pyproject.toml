[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacetime-memory"
version = "1.0.0"
description = "Multi-layer memory infrastructure for AI agents on SpacetimeDB"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Spacetime Memory Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
cli = [
    "click>=8.1",
    "rich>=13.0",
]
cross-encoder = [
    "numpy>=1.24",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]
otel = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]
rerank = [
    "numpy>=1.24",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",
    "click>=8",
    "feedparser>=6",
    "ruff>=0.6",
    "spacetime-memory[rerank]",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-autorefs>=1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[project.urls]
Homepage = "https://github.com/omiinaya/spacetime-memory"
Documentation = "https://omiinaya.github.io/spacetime-memory/"
Repository = "https://github.com/omiinaya/spacetime-memory"

[project.scripts]
stmem = "spacetime_memory.cli:cli"
spacetime-memory = "spacetime_memory.cli:cli"

[tool.pytest.ini_options]
markers = [
    "unit: tests that mock HTTP — no SpacetimeDB required",
    "integration: tests that need a running SpacetimeDB standalone",
    "embedder: tests that also need the ONNX embedder sidecar on :9090",
    "asyncio: async test — requires pytest-asyncio plugin",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
