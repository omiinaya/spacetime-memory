# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.yml

site_name: Spacetime-Memory
site_description: Multi-layer memory infrastructure for AI agents — on SpacetimeDB
site_url: https://omiinaya.github.io/spacetime-memory/
repo_url: https://github.com/omiinaya/spacetime-memory
repo_name: omiinaya/spacetime-memory

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage:
    - SDK Adapters: usage/adapters.md
    - Client API: usage/client.md
    - CLI Commands: usage/cli.md
    - Connector Setup Guide: usage/connectors.md
    - Self-Hosted Deployment: usage/self-hosted.md
  - Deployment Guide: DEPLOYMENT.md
  - Migration Guide (v2.4 → v2.6): migration-v2.4-to-v2.6.md
  - Configuration Reference: CONFIG.md
  - Changelog: CHANGELOG.md
  - API Reference:
    - Overview: api/index.md
    - Client: api/client.md
    - Compounder: api/compounder.md
    - SDK Adapters: api/sdks.md
    - Connectors: api/connectors.md
    - Utilities: api/utilities.md
    - TypeScript SDK:
      - Overview: api/typescript/index.md
      - Client: api/typescript/client.md
      - Compounder: api/typescript/compounder.md
      - DeltaSync: api/typescript/delta_sync.md
      - Mem0 Adapter: api/typescript/mem0.md
      - Memories: api/typescript/memories.md
      - Notes: api/typescript/notes.md
      - KG: api/typescript/kg.md
      - Sessions: api/typescript/sessions.md
      - Peers: api/typescript/peers.md
      - Profile: api/typescript/profile.md
      - Tags: api/typescript/tags.md
      - Users: api/typescript/users.md
      - Workspaces: api/typescript/workspaces.md
      - Types: api/typescript/types.md
  - Development: development.md
  - Benchmarks:
    - Competitor Comparison: benchmarks/competitor-comparison.md
    - Official Mem0 Harness: benchmarks/official-mem0-harness.md
    - Official Zep Harness: benchmarks/official-zep-harness.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [sdk/python]
          options:
            show_source: true
            show_bases: true
            show_docstring_examples: true
            show_signature_annotations: true
            docstring_style: google

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/omiinaya/spacetime-memory

copyright: Copyright &copy; 2024 Spacetime Memory Contributors
