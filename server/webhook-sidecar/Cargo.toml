[package]
name = "webhook-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Webhook delivery sidecar for spacetime-memory"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
