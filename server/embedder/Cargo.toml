[package]
name = "embedder"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "ONNX embedding sidecar for spacetime-memory — CUDA/ROCm optional"

[features]
default = ["cpu"]
cpu = []
cuda = ["ort", "ort/cuda"]
rocm = ["ort", "ort/rocm"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-onnx = "0.23.1"
tokenizers = { version = "0.23", features = ["http"] }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["load-dynamic", "download-binaries", "copy-dylibs", "api-18", "tls-rustls"] }
