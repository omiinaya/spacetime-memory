[package]
name = "embedder"
version = "0.2.0"
edition = "2021"
description = "GPU-accelerated ONNX embedding sidecar for spacetime-memory (CUDA/ROCm/CPU)"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "2.0.0-rc.12", features = ["cuda", "rocm", "ndarray", "load-dynamic", "download-binaries"] }
tokenizers = { version = "0.23", features = ["http"] }
