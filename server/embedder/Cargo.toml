[package]
name = "embedder"
version = "0.1.0"
edition = "2021"
description = "ONNX embedding sidecar for spacetime-memory"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tract-onnx = "0.23"
tokenizers = { version = "0.23", features = ["http"] }
