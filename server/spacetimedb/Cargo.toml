[package]
name = "spacetime-memory"
version = "0.1.0"
edition = "2021"
description = "Multi-layer memory infrastructure for AI agents on SpacetimeDB"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "2.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
