name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (host target)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/spacetimedb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: cargo test

  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          pip install -e ".[dev]"
          pip install pytest httpx
      - name: Syntax check
        run: python -m compileall spacetime_memory/
      - name: Unit tests (no STDB required)
        run: python -m pytest tests/ -v --ignore=tests/smoke_test.py -k "not integration and not concurrency" --tb=short
