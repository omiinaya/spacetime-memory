name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SPACETIMEDB_VERSION: "2.4.1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo check
        working-directory: server/spacetimedb
      - run: cargo test --lib
        working-directory: server/spacetimedb

  python-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK
        run: pip install -e "sdk/python[dev]"
      - name: Install test deps
        run: pip install rich feedparser httpx pytest
      - name: Run Python unit tests (no SpacetimeDB needed)
        working-directory: sdk/python
        run: python -m pytest tests/ -m unit -v

  python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SpacetimeDB CLI
        run: |
          curl -fsSL https://github.com/clockworklabs/SpacetimeDB/releases/download/v${{ env.SPACETIMEDB_VERSION }}/spacetime-${{ env.SPACETIMEDB_VERSION }}-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C /usr/local/bin spacetime
          chmod +x /usr/local/bin/spacetime
      - name: Generate JWT keys
        run: |
          mkdir -p data
          openssl ecparam -name prime256v1 -genkey -noout -out data/id_ecdsa_pkcs8.pem
          openssl ec -in data/id_ecdsa_pkcs8.pem -pubout -out data/id_ecdsa.pub
      - name: Start SpacetimeDB standalone
        run: |
          spacetime start --listen-addr 127.0.0.1:3001 \
            --data-dir /tmp/spacetime-ci \
            --jwt-priv-key-path data/id_ecdsa_pkcs8.pem \
            --jwt-pub-key-path data/id_ecdsa.pub &
          sleep 3
      - name: Install SDK
        run: pip install -e "sdk/python[dev]"
      - name: Install test deps
        run: pip install rich feedparser httpx pytest
      - name: Build WASM module
        run: cargo build --target wasm32-unknown-unknown --release
        working-directory: server/spacetimedb
      - name: Run integration tests
        working-directory: sdk/python
        run: python -m pytest tests/test_integration.py -m integration -v
        env:
          SPACETIMEDB_HOST: localhost

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: client
      - run: npx tsc --noEmit
        working-directory: client

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t spacetime-memory .
      - name: Test Docker image (smoke)
        run: |
          docker run -d --name stmem-test -p 3001:3001 -p 9090:9090 spacetime-memory
          sleep 15
          curl -s http://localhost:3001/ | head -5 || echo "DB port listening"
          docker stop stmem-test
          docker rm stmem-test
