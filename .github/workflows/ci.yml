name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - run: cargo check
        working-directory: server/spacetimedb
      - run: cargo test --lib
        working-directory: server/spacetimedb

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e sdk/python
      - run: pip install pytest pytest-mock httpx click feedparser
      - run: python -m pytest sdk/python/tests/ -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: client
      - run: npx tsc --noEmit
        working-directory: client

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t spacetime-memory .
      - name: Test Docker image (smoke)
        run: |
          docker run -d --name stmem-test -p 3001:3001 -p 9090:9090 spacetime-memory
          sleep 10
          curl -s http://localhost:3001/health || echo "DB not ready yet (expected in CI)"
          docker stop stmem-test
          docker rm stmem-test
