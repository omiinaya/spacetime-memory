name: Publish TypeScript SDK to npm

on:
  push:
    tags:
      - "ts-v*.*.*"

jobs:
  publish:
    runs-on: [self-hosted, ubuntu-latest]

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Configure npmrc for CI
        run: |
          # Copy project .npmrc to ensure CI-specific settings
          # (registry, audit=false, prefer-offline, etc.)
          cp ../../.npmrc ./.npmrc
          node -e "const fs=require('fs'); console.log('npmrc configured:', fs.readFileSync('.npmrc','utf8').split('\\n')[0])"

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
